name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
